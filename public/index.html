<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Aplikasi Penjualan</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 1rem; }
  .login-box { background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 100%; max-width: 400px; }
  h1 { text-align: center; color: #333; margin-bottom: 0.5rem; font-size: 1.8rem; }
  .subtitle { text-align: center; color: #888; margin-bottom: 2rem; font-size: 0.9rem; }
  label { display: block; margin-bottom: 0.5rem; color: #555; font-weight: 600; font-size: 0.9rem; }
  input { width: 100%; padding: 0.75rem; border: 2px solid #e0e0e0; border-radius: 8px; margin-bottom: 1rem; font-size: 1rem; transition: border 0.3s; }
  input:focus { outline: none; border-color: #667eea; }
  button { width: 100%; padding: 0.85rem; background: #667eea; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.3s; }
  button:hover { background: #5568d3; }
  .error { color: #e74c3c; text-align: center; margin-top: 1rem; font-size: 0.9rem; display: none; }
  .error.show { display: block; }
</style>
</head>
<body>
  <div class="login-box">
    <h1>🔐 Login</h1>
    <p class="subtitle">Aplikasi Penjualan</p>
    <form id="loginForm">
      <label>Username</label>
      <input type="text" id="username" required autocomplete="username">
      <label>Password</label>
      <input type="password" id="password" required autocomplete="current-password">
      <button type="submit">Masuk</button>
      <p class="error" id="errorMsg">Username atau password salah!</p>
    </form>
  </div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value;
  const password = document.getElementById('password').value;
  const errorMsg = document.getElementById('errorMsg');

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });

    if (res.ok) {
      const data = await res.json();
      localStorage.setItem('session_token', data.token);
      localStorage.setItem('session_user', username);
      window.location.href = '/dashboard.html';
    } else {
      errorMsg.classList.add('show');
    }
  } catch (err) {
    errorMsg.textContent = 'Terjadi kesalahan: ' + err.message;
    errorMsg.classList.add('show');
  }
});
</script>
</body>
</html>
